name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk grip-gains-auto-bw.apk

      - name: Publish APK as "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest grip-gains-auto-bw.apk \
            --title "Grip Gains Auto BW (build ${{ github.run_number }})" \
            --notes "Build automatique depuis ${{ github.sha }}. Télécharge grip-gains-auto-bw.apk depuis ton téléphone pour l'installer."
